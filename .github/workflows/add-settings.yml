name: Auto-Generate Settings UI

on: workflow_dispatch

permissions:
  contents: write

jobs:
  build-settings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Settings XML Layout
        run: |
          mkdir -p app/src/main/res/layout
          
          cat << 'EOF' > app/src/main/res/layout/activity_settings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#FFFFFF"
              android:orientation="vertical">

              <!-- Top Bar -->
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:background="#F0F4F8"
                  android:gravity="center_vertical"
                  android:paddingHorizontal="16dp">
                  <ImageView
                      android:id="@+id/btnBack"
                      android:layout_width="24dp"
                      android:layout_height="24dp"
                      android:src="@android:drawable/ic_menu_revert"
                      android:rotation="90"
                      app:tint="#1F2937"
                      android:background="?attr/selectableItemBackgroundBorderless"/>
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="16dp"
                      android:text="Settings"
                      android:textColor="#1F2937"
                      android:textSize="20sp"/>
              </LinearLayout>

              <ScrollView
                  android:layout_width="match_parent"
                  android:layout_height="match_parent">
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:paddingTop="8dp">

                      <!-- Standard Item -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_edit" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="Themes" android:textColor="#374151" android:textSize="16sp"/>
                      </LinearLayout>

                      <!-- Item with Arrow -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_manage" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="Lock Customization" android:textColor="#374151" android:textSize="16sp"/>
                          <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text=">" android:textColor="#00838F" android:textSize="18sp" android:textStyle="bold"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_camera" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="Intruder Selfie" android:textColor="#374151" android:textSize="16sp"/>
                      </LinearLayout>

                      <!-- Item with Toggle -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_view" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="Hide App Icon" android:textColor="#374151" android:textSize="16sp"/>
                          <com.google.android.material.switchmaterial.SwitchMaterial android:layout_width="wrap_content" android:layout_height="wrap_content" android:checked="true" app:thumbTint="#00838F" app:trackTint="#B2DFDB"/>
                      </LinearLayout>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_recent_history" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="Lock Recent Apps screen" android:textColor="#374151" android:textSize="16sp"/>
                          <com.google.android.material.switchmaterial.SwitchMaterial android:layout_width="wrap_content" android:layout_height="wrap_content"/>
                      </LinearLayout>

                      <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#E5E7EB" android:layout_marginHorizontal="16dp" android:layout_marginVertical="8dp"/>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_lock_lock" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="Change Password" android:textColor="#374151" android:textSize="16sp"/>
                      </LinearLayout>

                      <!-- Item with Subtitle and Toggle -->
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_delete" app:tint="#00838F"/>
                          <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical" android:layout_marginStart="16dp">
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Uninstallation Protection" android:textColor="#374151" android:textSize="16sp"/>
                              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Enable this to prevent AppLock from getting paused or uninstalled by intruders." android:textColor="#6B7280" android:textSize="12sp" android:layout_marginTop="4dp"/>
                          </LinearLayout>
                          <com.google.android.material.switchmaterial.SwitchMaterial android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginStart="8dp"/>
                      </LinearLayout>

                      <View android:layout_width="match_parent" android:layout_height="1dp" android:background="#E5E7EB" android:layout_marginHorizontal="16dp" android:layout_marginVertical="8dp"/>

                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="16dp" android:gravity="center_vertical">
                          <ImageView android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_menu_info_details" app:tint="#00838F"/>
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="About Us" android:textColor="#374151" android:textSize="16sp"/>
                      </LinearLayout>
                      
                      <View android:layout_width="match_parent" android:layout_height="40dp"/>
                  </LinearLayout>
              </ScrollView>
          </LinearLayout>
          EOF

      - name: Create SettingsActivity.kt
        run: |
          mkdir -p app/src/main/java/com/example/personalapplock
          
          cat << 'EOF' > app/src/main/java/com/example/personalapplock/SettingsActivity.kt
          package com.example.personalapplock

          import android.os.Bundle
          import android.widget.ImageView
          import androidx.fragment.app.FragmentActivity

          class SettingsActivity : FragmentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_settings)

                  // Wire up the back button
                  findViewById<ImageView>(R.id.btnBack).setOnClickListener {
                      finish() // Closes settings and goes back to main screen
                  }
              }
          }
          EOF

      - name: Link MainActivity to Settings
        run: |
          # Give the gear icon an ID so we can click it
          sed -i 's/android:src="@android:drawable\/ic_menu_manage"/android:id="@+id\/btnSettings"\n                    android:src="@android:drawable\/ic_menu_manage"/g' app/src/main/res/layout/activity_main.xml || true
          
          # Add the intent logic to MainActivity.kt
          sed -i '/import android.os.Bundle/a import android.content.Intent\nimport android.widget.ImageView' app/src/main/java/com/example/personalapplock/MainActivity.kt || true
          sed -i '/val tabLayout/i \        findViewById<ImageView>(R.id.btnSettings).setOnClickListener { startActivity(Intent(this, SettingsActivity::class.java)) }' app/src/main/java/com/example/personalapplock/MainActivity.kt || true

      - name: Register SettingsActivity in Manifest
        run: |
          sed -i '/<\/application>/i \        <activity android:name=".SettingsActivity" android:exported="false" />' app/src/main/AndroidManifest.xml || true

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add settings screen and wire navigation" || echo "No changes to commit"
          git push
