
name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PersonalAppLock_AndroidStudio_Starter.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q PersonalAppLock_AndroidStudio_Starter.zip -d source

      - name: Build debug APK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          gradle --no-daemon -p source/PersonalAppLock :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAppLock-debug-apk
          path: source/PersonalAppLock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
