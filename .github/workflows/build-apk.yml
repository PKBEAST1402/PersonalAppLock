name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17 Compatibility & Inject Dependencies
        run: |
          echo "" >> app/build.gradle.kts || true
          echo "android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }" >> app/build.gradle.kts || true
          if ! grep -q "com.google.android.material" app/build.gradle.kts; then
            echo "dependencies { implementation(\"androidx.recyclerview:recyclerview:1.3.2\"); implementation(\"com.google.android.material:material:1.12.0\") }" >> app/build.gradle.kts
          fi

      - name: Fix BiometricPrompt Activity Superclass
        run: |
          sed -i 's/class LockActivity : ComponentActivity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true
          sed -i 's/class LockActivity : Activity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true

      - name: Auto-Generate Missing UI & Link Kotlin
        run: |
          mkdir -p app/src/main/res/layout
          
          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#FAFAFA" android:orientation="vertical">
              <RelativeLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="20dp">
                  <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Praveen AppLock" android:textSize="22sp" android:textStyle="bold" android:textColor="#1F2937" android:layout_centerVertical="true"/>
                  <ImageView android:id="@+id/btnSettings" android:layout_width="28dp" android:layout_height="28dp" android:layout_alignParentEnd="true" android:layout_centerVertical="true" android:src="@android:drawable/ic_menu_manage" app:tint="#00838F"/>
              </RelativeLayout>
              <com.google.android.material.tabs.TabLayout android:id="@+id/tabLayout" android:layout_width="match_parent" android:layout_height="wrap_content" android:background="#FAFAFA" app:tabIndicatorColor="#00838F" app:tabSelectedTextColor="#00838F" app:tabTextColor="#6B7280">
                  <com.google.android.material.tabs.TabItem android:text="All Apps"/>
                  <com.google.android.material.tabs.TabItem android:text="Locked Apps"/>
              </com.google.android.material.tabs.TabLayout>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/recyclerViewApps" android:layout_width="match_parent" android:layout_height="match_parent" app:layoutManager="androidx.recyclerview.widget.LinearLayoutManager"/>
          </LinearLayout>
          EOF

          # item_app.xml
          cat << 'EOF' > app/src/main/res/layout/item_app.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" xmlns:app="http://schemas.android.com/apk/res-auto" android:layout_width="match_parent" android:layout_height="wrap_content" android:paddingHorizontal="20dp" android:paddingVertical="14dp" android:gravity="center_vertical">
              <ImageView android:id="@+id/appIcon" android:layout_width="44dp" android:layout_height="44dp" android:src="@mipmap/ic_launcher"/>
              <TextView android:id="@+id/appName" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginStart="16dp" android:text="App Name" android:textColor="#1F2937" android:textSize="16sp"/>
              <ImageView android:id="@+id/lockIcon" android:layout_width="24dp" android:layout_height="24dp" android:src="@android:drawable/ic_secure" app:tint="#00838F"/>
          </LinearLayout>
          EOF
          
          # CRITICAL FIX: Delete any existing R imports to prevent duplicates
          sed -i '/import .*\.R/d' app/src/main/java/com/example/personalapplock/*.kt || true

          # Inject exactly one clean import dynamically
          NAMESPACE=$(grep -oP 'namespace\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "com.example.personalapplock")
          sed -i "s/package com.example.personalapplock/package com.example.personalapplock\n\nimport $NAMESPACE.R/g" app/src/main/java/com/example/personalapplock/*.kt || true

      - name: Set App Name and Icon
        run: |
          VERSION_SUFFIX=$(printf "%03d" ${{ github.run_number }})
          NEW_APP_NAME="Praveen Applock v0.$VERSION_SUFFIX"
          
          sed -i -E "s/<string name=\"app_name\".*>.*<\/string>/<string name=\"app_name\">$NEW_APP_NAME<\/string>/g" app/src/main/res/values/strings.xml || true
          
          THUMBNAIL_PATH=$(find . -name "app_thumbnail.png" | head -n 1)
          
          if [ -n "$THUMBNAIL_PATH" ]; then
            echo "Successfully found PNG thumbnail at: $THUMBNAIL_PATH"
            rm -rf app/src/main/res/mipmap-* || true
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp "$THUMBNAIL_PATH" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp "$THUMBNAIL_PATH" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' app/src/main/AndroidManifest.xml || true
          else
            echo "WARNING: app_thumbnail.png was not found!"
          fi
          
          echo "APK_FILENAME=Praveen_Applock_v0.${VERSION_SUFFIX}" >> $GITHUB_ENV
          echo "VERSION_TAG=v0.${VERSION_SUFFIX}" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK File
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release for Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          files: app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk
