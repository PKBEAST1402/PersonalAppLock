name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17 Compatibility
        run: |
          echo "" >> app/build.gradle.kts || true
          echo "android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }" >> app/build.gradle.kts || true

      - name: Fix BiometricPrompt Activity Superclass
        run: |
          sed -i 's/class LockActivity : ComponentActivity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true
          sed -i 's/class LockActivity : Activity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAppLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
