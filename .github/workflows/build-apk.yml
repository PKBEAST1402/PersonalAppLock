name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17 Compatibility
        run: |
          echo "" >> app/build.gradle.kts || true
          echo "android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }" >> app/build.gradle.kts || true

      - name: Fix BiometricPrompt Activity Superclass
        run: |
          sed -i 's/class LockActivity : ComponentActivity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true
          sed -i 's/class LockActivity : Activity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true

      - name: Set App Name and Icon
        run: |
          # 1. Format the GitHub Action run number to 3 digits (e.g., 001, 002)
          VERSION_SUFFIX=$(printf "%03d" ${{ github.run_number }})
          NEW_APP_NAME="Praveen Applock v0.$VERSION_SUFFIX"
          
          # 2. Update the app name in strings.xml
          sed -i "s/<string name=\"app_name\">.*<\/string>/<string name=\"app_name\">$NEW_APP_NAME<\/string>/g" app/src/main/res/values/strings.xml || true
          
          # 3. Setup the new app icon (if uploaded to the root of the repository)
          if [ -f "app_icon.jpg" ]; then
            mkdir -p app/src/main/res/drawable
            cp app_icon.jpg app/src/main/res/drawable/app_icon.jpg
            sed -i 's/android:icon="[^"]*"/android:icon="@drawable\/app_icon"/g' app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@drawable\/app_icon"/g' app/src/main/AndroidManifest.xml || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAppLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
