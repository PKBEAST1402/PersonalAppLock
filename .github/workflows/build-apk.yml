name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - "PersonalAppLock_AndroidStudio_Starter.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q PersonalAppLock_AndroidStudio_Starter.zip -d source

      - name: Fix JVM Target Compatibility
        working-directory: ./source/PersonalAppLock
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' app/build.gradle.kts || true
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        working-directory: ./source/PersonalAppLock
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PersonalAppLock-debug-apk
          path: source/PersonalAppLock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
