name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set App Name and Icon
        run: |
          VERSION_SUFFIX=$(printf "%03d" ${{ github.run_number }})
          NEW_APP_NAME="Praveen Applock v0.$VERSION_SUFFIX"
          
          sed -i -E "s/<string name=\"app_name\".*>.*<\/string>/<string name=\"app_name\">$NEW_APP_NAME<\/string>/g" app/src/main/res/values/strings.xml || true
          
          THUMBNAIL_PATH=$(find . -name "app_thumbnail.png" | head -n 1)
          if [ -n "$THUMBNAIL_PATH" ]; then
            rm -rf app/src/main/res/mipmap-* || true
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            cp "$THUMBNAIL_PATH" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp "$THUMBNAIL_PATH" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' app/src/main/AndroidManifest.xml || true
          fi
          
          echo "APK_FILENAME=Praveen_Applock_v0.${VERSION_SUFFIX}" >> $GITHUB_ENV
          echo "VERSION_TAG=v0.${VERSION_SUFFIX}" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK File
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          files: app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk
