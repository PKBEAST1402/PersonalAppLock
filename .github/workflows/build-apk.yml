name: Build Personal AppLock APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Force Java 17 Compatibility
        run: |
          echo "" >> app/build.gradle.kts || true
          echo "android { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }" >> app/build.gradle.kts || true

      - name: Fix BiometricPrompt Activity Superclass
        run: |
          sed -i 's/class LockActivity : ComponentActivity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true
          sed -i 's/class LockActivity : Activity/class LockActivity : androidx.fragment.app.FragmentActivity/g' app/src/main/java/com/example/personalapplock/LockActivity.kt || true

      - name: Set App Name and Icon
        run: |
          VERSION_SUFFIX=$(printf "%03d" ${{ github.run_number }})
          NEW_APP_NAME="Praveen Applock v0.$VERSION_SUFFIX"
          
          # Force overwrite the app_name string
          sed -i -E "s/<string name=\"app_name\".*>.*<\/string>/<string name=\"app_name\">$NEW_APP_NAME<\/string>/g" app/src/main/res/values/strings.xml || true
          
          # Use the new PNG thumbnail directly
          THUMBNAIL_PATH=$(find . -name "app_thumbnail.png" | head -n 1)
          
          if [ -n "$THUMBNAIL_PATH" ]; then
            echo "Successfully found PNG thumbnail at: $THUMBNAIL_PATH"
            
            # CRITICAL FIX: Delete all default adaptive icons so they don't override the PNG
            rm -rf app/src/main/res/mipmap-* || true
            
            # Create the specific 'mipmap' folder that Android File Managers expect
            mkdir -p app/src/main/res/mipmap-xxxhdpi
            
            # Copy the PNG directly as the new launcher icon
            cp "$THUMBNAIL_PATH" app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp "$THUMBNAIL_PATH" app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
            
            # Update manifest to point to the correct PNG icons
            sed -i 's/android:icon="[^"]*"/android:icon="@mipmap\/ic_launcher"/g' app/src/main/AndroidManifest.xml || true
            sed -i 's/android:roundIcon="[^"]*"/android:roundIcon="@mipmap\/ic_launcher_round"/g' app/src/main/AndroidManifest.xml || true
          else
            echo "WARNING: app_thumbnail.png was not found!"
          fi
          
          echo "APK_FILENAME=Praveen_Applock_v0.${VERSION_SUFFIX}" >> $GITHUB_ENV
          echo "VERSION_TAG=v0.${VERSION_SUFFIX}" >> $GITHUB_ENV

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK File
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILENAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release for Direct APK Download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: Release ${{ env.VERSION_TAG }}
          files: app/build/outputs/apk/debug/${{ env.APK_FILENAME }}.apk
