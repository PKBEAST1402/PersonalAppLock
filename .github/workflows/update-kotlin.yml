name: Auto-Update Kotlin Logic

on: workflow_dispatch

permissions:
  contents: write

jobs:
  update-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write AppAdapter.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/example/personalapplock/AppAdapter.kt
          package com.example.personalapplock

          import android.view.LayoutInflater
          import android.view.View
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.TextView
          import androidx.recyclerview.widget.RecyclerView

          class AppAdapter(private var appList: List<String>) : RecyclerView.Adapter<AppAdapter.ViewHolder>() {

              class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                  val appName: TextView = view.findViewById(R.id.appName)
                  val appIcon: ImageView = view.findViewById(R.id.appIcon)
                  val lockIcon: ImageView = view.findViewById(R.id.lockIcon)
              }

              override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                  val view = LayoutInflater.from(parent.context).inflate(R.layout.item_app, parent, false)
                  return ViewHolder(view)
              }

              override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                  holder.appName.text = appList[position]
                  // Note: Real app icons and locking logic will be added here later!
              }

              override fun getItemCount() = appList.size
              
              fun updateData(newList: List<String>) {
                  appList = newList
                  notifyDataSetChanged()
              }
          }
          EOF

      - name: Write MainActivity.kt
        run: |
          cat << 'EOF' > app/src/main/java/com/example/personalapplock/MainActivity.kt
          package com.example.personalapplock

          import android.os.Bundle
          import androidx.fragment.app.FragmentActivity
          import androidx.recyclerview.widget.LinearLayoutManager
          import androidx.recyclerview.widget.RecyclerView
          import com.google.android.material.tabs.TabLayout

          class MainActivity : FragmentActivity() {
              
              // Dummy data matching your screenshot to test the UI!
              private val allApps = listOf("ACT Fibernet", "Amazon", "Authenticator", "Bixby", "Bloomee", "Brake Time", "Calculator", "Calendar", "Camera")
              private val lockedApps = listOf("Amazon", "Camera", "Photos") // Example locked apps
              
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val recyclerView = findViewById<RecyclerView>(R.id.recyclerViewApps)
                  recyclerView.layoutManager = LinearLayoutManager(this)
                  
                  val adapter = AppAdapter(allApps)
                  recyclerView.adapter = adapter

                  val tabLayout = findViewById<TabLayout>(R.id.tabLayout)
                  tabLayout.addOnTabSelectedListener(object : TabLayout.OnTabSelectedListener {
                      override fun onTabSelected(tab: TabLayout.Tab?) {
                          if (tab?.position == 0) {
                              adapter.updateData(allApps) // Show all apps
                          } else {
                              adapter.updateData(lockedApps) // Show only locked apps
                          }
                      }
                      override fun onTabUnselected(tab: TabLayout.Tab?) {}
                      override fun onTabReselected(tab: TabLayout.Tab?) {}
                  })
              }
          }
          EOF

      - name: Update Theme to Material
        run: |
          sed -i 's/android:theme="@style\/[^"]*"/android:theme="@style\/Theme.MaterialComponents.Light.NoActionBar"/g' app/src/main/AndroidManifest.xml || true

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/personalapplock/AppAdapter.kt
          git add app/src/main/java/com/example/personalapplock/MainActivity.kt
          git add app/src/main/AndroidManifest.xml
          git commit -m "feat: connect modern UI XML to MainActivity logic" || echo "No changes to commit"
          git push
